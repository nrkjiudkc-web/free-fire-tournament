<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - FF ARENA</title>
<style>body{background:#02050f;color:#fff;font-family:sans-serif;padding:16px} .card{background:#111a2f;border:1px solid #22345a;border-radius:12px;padding:12px;margin:10px 0} .btn{padding:8px 14px;border:none;border-radius:8px;font-weight:800;margin-right:6px} .ap{background:#00c853;color:#fff} .rj{background:#ff0040;color:#fff} input{padding:10px;border-radius:8px;border:1px solid #2a3a5a;background:#02050f;color:#fff}</style>
</head><body>
<h2>🔐 Admin Panel - FF ARENA BD</h2>
<div id="login"><input id="pass" type="password" placeholder="Admin Password"><button class="btn ap" onclick="login()">Login</button><p style="color:#5a7ab0;font-size:12px">Password: admin123 (পরে চেঞ্জ করে দিবো)</p></div>
<div id="panel" style="display:none">
<h3>💰 Deposit Requests</h3><div id="depList"></div>
<h3 style="margin-top:20px">🎮 Join List</h3><div id="joinList"></div>
<button class="btn" style="background:#333;color:#fff;margin-top:20px" onclick="clearAll()">Clear All Data</button>
</div>
<script>
function login(){if(pass.value=='admin123'){loginDiv();}else alert('Wrong Password')}
function loginDiv(){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load()}
function load(){
 let deps=JSON.parse(localStorage.getItem('ff_deposits')||'[]');
 document.getElementById('depList').innerHTML=deps.length==0?'No Request':deps.map(d=>`<div class="card"><b>৳${d.amount}</b> - ${d.sender}<br>Trx: ${d.trx}<br><small>${d.time} - ${d.status}</small><br><br><button class="btn ap" onclick="approve(${d.id},${d.amount})">✅ Approve</button><button class="btn rj" onclick="reject(${d.id})">❌ Reject</button></div>`).join('');
 let joins=JSON.parse(localStorage.getItem('ff_joins')||'[]');
 document.getElementById('joinList').innerHTML=joins.length==0?'No Joins':joins.map(j=>`<div class="card"><b>${j.room}</b> - Fee ${j.fee}<br>Player: ${j.name} | UID: ${j.uid}<br><small>${j.time}</small></div>`).join('');
}
function approve(id,amt){
 let deps=JSON.parse(localStorage.getItem('ff_deposits')||'[]');
 let bal=parseInt(localStorage.getItem('ff_balance')||'0'); bal+=amt; localStorage.setItem('ff_balance',bal);
 deps=deps.map(d=>d.id==id?{...d,status:'approved'}:d); localStorage.setItem('ff_deposits',JSON.stringify(deps));
 alert('Approved! ৳'+amt+' Added to Player Wallet'); load();
}
function reject(id){let deps=JSON.parse(localStorage.getItem('ff_deposits')||'[]'); deps=deps.filter(d=>d.id!=id); localStorage.setItem('ff_deposits',JSON.stringify(deps)); load();}
function clearAll(){if(confirm('সব ডাটা মুছে যাবে!')){localStorage.clear();location.reload()}}
</script>
</body></html>
