<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN</title><style>body{background:#050a18;color:#fff;font-family:sans-serif;padding:16px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;background:#101d38;border:1px solid #1e345e;color:#fff}button{padding:12px;border-radius:10px;border:none;font-weight:900} .card{background:#101d38;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #1e345e}</style></head><body><div id="lock" style="max-width:400px;margin:50px auto;text-align:center"><h2>ADMIN LOGIN</h2><input id="pass" type="password" placeholder="Password"><button onclick="login()" style="width:100%;background:#2a5bff;color:#fff;margin-top:10px">LOGIN</button><p>Pass: admin123</p></div><div id="panel" style="display:none;max-width:700px;margin:0 auto"><h2>FF ARENA ADMIN</h2><div class="card"><h3>Add Room</h3><input id="title" placeholder="Title Ex: Solo BR"><select id="type"><option value="BR">BR</option><option value="CUSTOM">CUSTOM</option></select><input id="map" placeholder="Map"><input id="entry" type="number" placeholder="Entry"><input id="prize" placeholder="Prize"><input id="time" placeholder="Time"><button onclick="addRoom()" style="background:#00c853;color:#fff;width:100%">ADD ROOM</button></div><div class="card"><h3>Room List</h3><div id="roomList"></div></div><div class="card"><h3>Deposit List</h3><div id="depList"></div></div></div><script>function login(){if(document.getElementById('pass').value==='admin123'){document.getElementById('lock').style.display='none';document.getElementById('panel').style.display='block';load();}else alert('Wrong')}let rooms=JSON.parse(localStorage.getItem('ff_rooms')||'[]');function load(){let rl=document.getElementById('roomList');rl.innerHTML='';rooms.forEach(r=>{rl.innerHTML+=`<div style="border-bottom:1px solid #222;padding:8px 0"><b>${r.title}</b><br><input id="rid-${r.id}" placeholder="Room ID" value="${r.roomId||''}"><input id="rpass-${r.id}" placeholder="Pass" value="${r.pass||''}"><button onclick="saveRoom(${r.id})" style="background:#ff9800">SAVE</button> <button onclick="delRoom(${r.id})" style="background:#ff1744;color:#fff">DEL</button></div>`});let req=JSON.parse(localStorage.getItem('ff_dep_req')||'[]');document.getElementById('depList').innerHTML=req.map((d,i)=>`${d.name} ${d.amount}TK Trx:${d.trx}`).join('<br>')||'Empty'}function addRoom(){let r={id:Date.now(),type:document.getElementById('type').value,title:document.getElementById('title').value,map:document.getElementById('map').value,entry:parseInt(document.getElementById('entry').value),prize:document.getElementById('prize').value,time:document.getElementById('time').value,status:'UPCOMING',roomId:'',pass:''};rooms.push(r);localStorage.setItem('ff_rooms',JSON.stringify(rooms));load();}function saveRoom(id){let r=rooms.find(x=>x.id==id);r.roomId=document.getElementById('rid-'+id).value;r.pass=document.getElementById('rpass-'+id).value;localStorage.setItem('ff_rooms',JSON.stringify(rooms));alert('Saved')}function delRoom(id){rooms=rooms.filter(x=>x.id!=id);localStorage.setItem('ff_rooms',JSON.stringify(rooms));load();}</script></body></html>
