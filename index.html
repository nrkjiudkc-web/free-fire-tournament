<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF ARENA BD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#070d1c;color:#fff}
.header{background:#101c34;padding:14px;display:flex;justify-content:space-between}
.logo{color:#00e5ff;font-weight:800}
.main{max-width:480px;margin:auto;padding:16px;padding-bottom:90px}
.wallet{background:linear-gradient(135deg,#13244a,#1e3a7a);border-radius:20px;padding:20px;border:1px solid #21365e}
.bal{font-size:42px;font-weight:800;color:#00e5ff}
.btns{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800}
.dep{background:#00c853;color:#fff}.with{background:#fff;color:#000}
.card{background:#111e38;border:1px solid #21365e;border-radius:18px;padding:16px;margin:14px 0}
.join{width:100%;background:#2a5bff;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9998;display:none;justify-content:center;align-items:center;padding:16px}
.modalBox{background:#101e38;border-radius:20px;padding:20px;width:100%;max-width:400px;border:1px solid #2a4a7a}
.modalBox input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a4a7a;background:#0a1228;color:#fff;margin:6px 0}
.bkash{background:#e2136e;padding:12px;border-radius:12px;text-align:center;font-weight:800;margin:10px 0}
</style>
</head>
<body>
<div class="header"><div class="logo">FF ARENA</div><div style="font-size:12px;color:#7ea0c8">BD Tournament</div></div>
<div class="main">
<div class="wallet">
<div style="color:#8aa0c5">Welcome, Player</div>
<div class="bal">৳ 0.00</div>
<div style="color:#00e5ff;font-size:12px;margin-top:4px">✅ Secure Wallet • bKash Payment</div>
<div class="btns"><button class="btn dep">+ Deposit</button><button class="btn with">Withdraw</button></div>
</div>
<h3 style="margin:18px 0 8px">🔥 Tournaments</h3>
<div id="list"></div>
</div>
<div class="modal" id="jModal">
<div class="modalBox">
<h3 id="mTitle">Join</h3>
<div class="bkash">bKash Personal: 01344758887<br><small>এই নাম্বারে Send Money করুন</small></div>
<input id="ffName" placeholder="Free Fire Name">
<input id="ffUid" placeholder="Free Fire UID">
<input id="senderNum" placeholder="যে নাম্বার থেকে টাকা পাঠিয়েছেন">
<input id="trxId" placeholder="bKash TrxID লিখুন">
<button class="join" onclick="submitJoin()">SUBMIT REQUEST</button>
<button onclick="closeM()" style="width:100%;margin-top:8px;background:#1a2a4a;color:#fff;padding:10px;border:none;border-radius:10px">Cancel</button>
<p style="font-size:11px;color:#7a9abf;margin-top:10px;text-align:center">TrxID ভুল দিলে Join বাতিল হবে। Admin 5 মিনিটে Approve করবে।</p>
</div>
</div>
<script>
let currentRoom=null;
let rooms=[{title:"Solo Battle",entry:"50",prize:"5,000",time:"Today 8PM",type:"Solo"},{title:"Duo Battle",entry:"100",prize:"10,000",time:"Today 9:30PM",type:"Duo"}];
function render(){document.getElementById('list').innerHTML=rooms.map(x=>`<div class="card"><b>${x.title}</b> <small style="color:#00e5ff">(${x.type})</small><div style="color:#7a9abf;font-size:13px;margin:6px 0">Entry ${x.entry} TK • Prize ${x.prize} TK<br>⏰ ${x.time}</div><button class="join" onclick="openM('${x.title}')">Join Now</button></div>`).join('')}
function openM(t){currentRoom=t;document.getElementById('mTitle').innerText=t;document.getElementById('jModal').style.display='flex'}
function closeM(){document.getElementById('jModal').style.display='none'}
function submitJoin(){if(!ffName.value||!trxId.value){alert('Name & TrxID দিন');return}alert('✅ Request Sent! bKash TrxID: '+trxId.value+' - Admin চেক করবে।');closeM()}
render();
</script>
</body>
</html>
