else if(r=='/wallet/withdraw'){html=`<div class="max-w-[500px] mx-auto px-4 py-6"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="text-[22px] font-black mt-2">Withdraw</h1><div class="bg-white border rounded-[24px] p-6 mt-4"><div class="bg-zinc-50 border rounded-[12px] p-4 flex justify-between text-[13px]"><span>Available</span><b>৳${DB.balance}</b></div><input id="wa" type="number" placeholder="Amount Min 100" class="w-full mt-4 border rounded-[12px] px-4 py-3.5"><input id="wn" placeholder="bKash Number" class="w-full mt-3 border rounded-[12px] px-4 py-3.5"><button onclick="wd()" class="w-full mt-5 bg-zinc-900 text-white py-3.5 rounded-full font-bold">Request Withdraw</button></div></div>`}
else if(r=='/transactions'){html=`<div class="max-w-[600px] mx-auto px-4 py-6"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="text-[22px] font-black mt-2">Transactions</h1><div class="mt-4 space-y-2.5">${DB.trx.map(t=>`<div class="bg-white border rounded-[14px] p-4 flex justify-between items-center"><div><b class="text-[13px]">${t.type}</b><div class="text-[11px] text-zinc-500 mt-0.5">${t.id} • ${t.date||''}</div></div><b class="text-[14px]">৳${t.amt}</b></div>`).join('')||'<div class="bg-white border rounded-[24px] p-10 text-center text-[13px] text-zinc-500">No transactions yet</div>'} </div></div>`}
else if(r=='/profile'){html=`<div class="max-w-[600px] mx-auto px-4 py-6"><h1 class="text-[22px] font-black">Profile</h1><div class="bg-white border rounded-[24px] p-6 mt-4 flex gap-4 items-center"><div class="w-14 h-14 bg-zinc-900 text-white rounded-full flex items-center justify-center font-black text-[20px]">${DB.user?DB.user.name[0].toUpperCase():'U'}</div><div><b class="text-[16px]">${DB.user?DB.user.name:'User'}</b><div class="text-[12px] text-zinc-500">${DB.user?DB.user.email:''}</div><div class="text-[11px] mt-1 bg-zinc-50 border inline-block px-2.5 py-1 rounded-full">${DB.user?DB.user.id:''} • ৳${DB.balance}</div></div></div><div class="grid grid-cols-2 gap-3 mt-4"><div class="bg-white border rounded-[18px] p-4 text-center"><div class="text-[22px] font-black">${DB.orders.length}</div><div class="text-[11px] text-zinc-500">Tournaments</div></div><div class="bg-white border rounded-[18px] p-4 text-center"><div class="text-[22px] font-black">৳${DB.balance}</div><div class="text-[11px] text-zinc-500">Balance</div></div></div><button onclick="logout()" class="w-full mt-4 p-4 bg-white border rounded-[18px] text-left text-red-600 font-bold text-[14px]">Logout →</button></div>`}
const bottom=`<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t flex justify-around py-2.5 z-30"><button onclick="nav('/')" class="flex flex-col items-center text-[10px] gap-0.5">🏠Home</button><button onclick="nav('/tournaments')" class="flex flex-col items-center text-[10px] gap-0.5">🏆Tour</button><button onclick="nav('/orders')" class="flex flex-col items-center text-[10px] gap-0.5">📦Orders</button><button onclick="nav('/wallet')" class="flex flex-col items-center text-[10px] gap-0.5">💳Wallet</button><button onclick="nav('/profile')" class="flex flex-col items-center text-[10px] gap-0.5">👤Profile</button></nav><div class="h-[75px] md:hidden"></div>`;
document.getElementById('app').innerHTML=header+html+bottom;
}
window.doLogin=()=>{const e=document.getElementById('le').value;if(!e){alert('Email দাও');return}DB.user={id:'TX-'+Math.floor(10000+Math.random()*90000),name:e.split('@')[0],email:e};save();nav('/')}
window.doReg=()=>{const n=document.getElementById('rn').value;const e=document.getElementById('re').value;if(!n||!e){alert('Fill all');return}DB.user={id:'TX-'+Math.floor(10000+Math.random()*90000),name:n,email:e};save();nav('/')}
window.joinT=(id)=>{const t=TOURNAMENTS.find(x=>x.id==id);if(DB.balance<t.entry){if(confirm(`Balance কম আছে ৳${DB.balance}, লাগবে ৳${t.entry}. Deposit করবা?`))nav('/wallet/deposit');return}DB.balance-=t.entry;const oid='TX'+Math.floor(100000+Math.random()*900000);DB.orders.push({id:oid,tid:t.id,name:t.title,amount:t.entry,date:new Date().toLocaleDateString()});DB.trx.unshift({id:oid,type:'Tournament Entry - '+t.title,amt:t.entry,date:new Date().toLocaleDateString()});save();alert('Joined! Order #'+oid);nav('/orders')}
window.dep=()=>{const a=document.getElementById('da').value;const s=document.getElementById('ds').value;const tr=document.getElementById('dt').value;if(!a||!s||!tr){alert('সব ঘর পূরণ করো');return}DB.balance+=Number(a);DB.trx.unshift({id:tr,type:'Deposit bKash 01344758887',amt:a,bkash:s,date:new Date().toLocaleDateString()});save();alert('Deposit Submitted! ৳'+a);nav('/wallet')}
window.wd=()=>{const a=Number(document.getElementById('wa').value);if(a<100||a>DB.balance){alert('Min 100');return}DB.balance-=a;DB.trx.unshift({id:'WD'+Date.now(),type:'Withdraw bKash',amt:a,date:new Date().toLocaleDateString()});save();alert('Withdraw Request ৳'+a);nav('/wallet')}
window.logout=()=>{localStorage.clear();location.hash='/login';location.reload()}
render();addEventListener('hashchange',()=>{state.route=location.hash.slice(1)||'/';render()})
</script>
</body>
</html>
