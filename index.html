<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TournaX - Compete. Play. Win.</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:system-ui}</style>
</head>
<body class="bg-[#fcfcfc]"><div id="app"></div>
<script>
const TOURNAMENTS=[
{id:"ff1",title:"TournaX Weekly Clash",game:"Free Fire",entry:20,prize:2000,total:100,joined:68,date:"22 Sep",time:"9:00 PM",status:"upcoming",banner:"🔥"},
{id:"pb1",title:"TournaX Battle Royale",game:"PUBG Mobile",entry:50,prize:5000,total:100,joined:92,date:"21 Sep",time:"8:00 PM",status:"live",banner:"🎯"},
{id:"ef1",title:"TournaX Pro League",game:"eFootball",entry:100,prize:10000,total:32,joined:14,date:"23 Sep",time:"7:30 PM",status:"upcoming",banner:"⚽"},
];
let DB={user:JSON.parse(localStorage.getItem('tx_user')||'null'),balance:Number(localStorage.getItem('tx_bal')||'850'),orders:JSON.parse(localStorage.getItem('tx_orders')||'[]'),trx:JSON.parse(localStorage.getItem('tx_trx')||'[]'),rooms:JSON.parse(localStorage.getItem('tx_rooms')||'{}')};
function save(){localStorage.setItem('tx_user',JSON.stringify(DB.user));localStorage.setItem('tx_bal',DB.balance);localStorage.setItem('tx_orders',JSON.stringify(DB.orders));localStorage.setItem('tx_trx',JSON.stringify(DB.trx));localStorage.setItem('tx_rooms',JSON.stringify(DB.rooms));}
let state={route:location.hash.slice(1)||'/',sel:null,admin:false};
function nav(r){location.hash=r;state.route=r;render();scrollTo(0,0)}
function TC(t){return `<div onclick="openT('${t.id}')" class="bg-white border rounded-[18px] p-4 cursor-pointer"><div class="flex gap-3"><div class="w-12 h-12 bg-zinc-100 rounded-[12px] flex items-center justify-center text-xl">${t.banner}</div><div class="flex-1"><div class="flex justify-between"><b class="text-[14px]">${t.title}</b><span class="text-[10px] px-2 py-1 rounded-full ${t.status=='live'?'bg-red-500 text-white':'bg-zinc-900 text-white'}">${t.status}</span></div><p class="text-[12px] text-zinc-500">${t.game} • ${t.date}</p><div class="flex gap-2 mt-2"><span class="bg-zinc-50 border rounded-full px-3 py-1 text-[11px]">৳${t.entry} Entry</span><span class="bg-amber-50 border text-amber-700 rounded-full px-3 py-1 text-[11px] font-bold">৳${t.prize}</span></div></div></div></div>`}
window.openT=(id)=>{state.sel=TOURNAMENTS.find(x=>x.id==id);nav('/tournaments/'+id)}
function checkAdmin(){const c=document.getElementById('acode').value;if(c==='AF-0134-ADMIN'){state.admin=true;render();}else alert('ভুল কোড!')}
function render(){
const r=state.route;
if(r==='/admin'){if(!state.admin){document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-4 bg-[#0a0a0a]"><div class="bg-[#1a1a1a] border border-zinc-800 rounded-[20px] p-8 w-full max-w-[380px] text-center"><h1 class="text-[22px] font-black text-white">AF ADMIN</h1><input id="acode" type="password" placeholder="Code" class="w-full mt-6 bg-zinc-900 border border-zinc-700 rounded-full px-5 py-3 text-white text-center"><button onclick="checkAdmin()" class="w-full mt-4 bg-[#39FF14] text-black font-black py-3 rounded-full">UNLOCK</button><p class="text-[10px] text-zinc-600 mt-4">Code: AF-0134-ADMIN<br>bKash: 01344758887</p><button onclick="nav('/')" class="mt-4 text-zinc-500 text-[12px]">Back</button></div></div>`;return;}else{document.getElementById('app').innerHTML=`<div class="min-h-screen bg-[#0a0a0a] text-white p-4"><div class="flex justify-between"><b class="text-[#39FF14]">TournaX ADMIN</b><button onclick="state.admin=false;nav('/')" class="border px-3 py-1 rounded-full text-[12px]">Logout</button></div><div class="mt-6 grid md:grid-cols-2 gap-4"><div class="bg-[#1a1a1a] border border-zinc-800 rounded-[20px] p-5"><h2>Room Control</h2><input id="rtid" placeholder="Tournament ID ex: ff1" class="w-full mt-3 bg-zinc-900 border border-zinc-700 rounded-[12px] px-4 py-3"><input id="roomId" placeholder="Room ID" class="w-full mt-2 bg-zinc-900 border border-zinc-700 rounded-[12px] px-4 py-3"><input id="roomPass" placeholder="Password" class="w-full mt-2 bg-zinc-900 border border-zinc-700 rounded-[12px] px-4 py-3"><button onclick="DB.rooms[document.getElementById('rtid').value]={id:document.getElementById('roomId').value,pass:document.getElementById('roomPass').value};save();alert('LIVE')" class="w-full mt-3 bg-[#39FF14] text-black font-bold py-3 rounded-full">ROOM LIVE</button></div><div class="bg-[#1a1a1a] border border-zinc-800 rounded-[20px] p-5"><h2>bKash 01344758887 Deposits</h2><div class="mt-3 space-y-2">${DB.trx.filter(t=>t.type.includes('Deposit')).map(d=>`<div class="bg-zinc-900 p-3 rounded-[12px] text-[12px]">${d.type} ৳${d.amt} - ${d.id}</div>`).join('')||'No request'}</div></div></div></div>`;return;}}
if(!DB.user&&r!=='/login'&&r!=='/register'&&r!=='/admin'){nav('/login');return;}
let h=`<header class="sticky top-0 z-20 bg-white border-b"><div class="max-w-[1100px] mx-auto px-4 h-[64px] flex justify-between items-center"><div class="flex gap-2 items-center"><div class="w-9 h-9 bg-zinc-900 text-white rounded-[10px] flex items-center justify-center font-black">TX</div><b>TournaX</b></div><div class="flex gap-2 items-center"><span class="text-[12px] font-bold">৳${DB.balance}</span><button onclick="nav('/profile')" class="w-9 h-9 rounded-full bg-zinc-900 text-white">${DB.user?DB.user.name[0]:'U'}</button></div></div></header>`;
let html='';
if(r=='/login'){html=`<div class="max-w-[400px] mx-auto px-4 py-20"><div class="bg-white border rounded-[24px] p-8"><h1 class="text-[26px] font-black">Welcome Back</h1><input id="le" placeholder="Email" class="w-full mt-6 border rounded-[12px] px-4 py-3"><input id="lp" type="password" placeholder="Password" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="doLogin()" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">Login</button><button onclick="nav('/register')" class="w-full mt-3 border py-3 rounded-full text-[13px]">Create Account</button></div></div>`}
else if(r=='/register'){html=`<div class="max-w-[400px] mx-auto px-4 py-16"><div class="bg-white border rounded-[24px] p-8"><h1 class="text-[26px] font-black">Create Account</h1><input id="rn" placeholder="Name" class="w-full mt-6 border rounded-[12px] px-4 py-3"><input id="re" placeholder="Email" class="w-full mt-3 border rounded-[12px] px-4 py-3"><input id="rp" type="password" placeholder="Password" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="doReg()" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">Sign Up</button></div></div>`}
else if(r=='/'||r==''){html=`<div class="max-w-[1100px] mx-auto px-4 py-5"><div class="bg-zinc-900 text-white rounded-[24px] p-7"><h1 class="text-[32px] font-black">Compete.<br>Play. Win.</h1><p class="text-zinc-400 text-[13px] mt-2">bKash: 01344758887</p><button onclick="nav('/tournaments')" class="mt-4 bg-white text-black px-6 py-2 rounded-full font-bold text-[13px]">Browse Tournaments</button></div><div class="grid md:grid-cols-3 gap-3 mt-5">${TOURNAMENTS.map(TC).join('')}</div></div>`}
else if(r.startsWith('/tournaments/')){const t=state.sel||TOURNAMENTS[0];const room=DB.rooms[t.id];html=`<div class="max-w-[800px] mx-auto px-4 py-6"><button onclick="nav('/')" class="text-[13px]">← Back</button><div class="bg-white border rounded-[24px] overflow-hidden mt-4"><div class="h-[120px] bg-zinc-900 flex items-center justify-center text-5xl">${t.banner}</div><div class="p-6"><h1 class="text-[22px] font-black">${t.title}</h1>${room?`<div class="mt-4 bg-black text-white rounded-[14px] p-4"><div class="text-[#39FF14] text-[11px] font-bold">🔴 ROOM LIVE</div><div class="font-mono text-[18px] font-black">ID: ${room.id} PASS: ${room.pass}</div></div>`:''}<button onclick="joinT('${t.id}')" class="w-full mt-6 bg-zinc-900 text-white py-4 rounded-full font-black">JOIN NOW ৳${t.entry}</button></div></div></div>`}
else if(r=='/tournaments'){html=`<div class="max-w-[1100px] mx-auto px-4 py-6"><h1 class="text-[22px] font-black">All Tournaments</h1><div class="grid md:grid-cols-3 gap-3 mt-4">${TOURNAMENTS.map(TC).join('')}</div></div>`}
else if(r=='/orders'){html=`<div class="max-w-[800px] mx-auto px-4 py-6"><h1 class="text-[20px] font-black">My Orders</h1><div class="mt-4 space-y-3">${DB.orders.length==0?`<div class="bg-white border rounded-[24px] p-10 text-center">No orders</div>`:DB.orders.map(o=>{const rm=DB.rooms[o.tid];return `<div class="bg-white border rounded-[18px] p-4"><b>${o.name}</b><div class="text-[12px] text-zinc-500">#${o.id}</div>${rm?`<div class="mt-2 bg-black text-white rounded-[10px] px-3 py-2 font-mono text-[13px]">ROOM ID: ${rm.id} | PASS: ${rm.pass}</div>`:''}</div>`}).join('')}</div></div>`}
else if(r=='/wallet'){html=`<div class="max-w-[800px] mx-auto px-4 py-6"><h1 class="text-[20px] font-black">Wallet ৳${DB.balance}</h1><div class="grid grid-cols-2 gap-3 mt-4"><button onclick="nav('/wallet/deposit')" class="bg-zinc-900 text-white py-3 rounded-full font-bold">Deposit</button><button onclick="nav('/wallet/withdraw')" class="border py-3 rounded-full font-bold">Withdraw</button></div><div class="mt-4 bg-pink-50 border border-pink-200 rounded-[14px] p-4"><b>bKash Personal</b><div class="text-[22px] font-black">01344758887</div></div><button onclick="nav('/transactions')" class="w-full mt-4 border py-3 rounded-full text-[13px]">Transactions</button></div>`}
else if(r=='/wallet/deposit'){html=`<div class="max-w-[500px] mx-auto px-4 py-6"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="text-[20px] font-black mt-2">Deposit</h1><div class="bg-white border rounded-[24px] p-6 mt-4"><div class="bg-pink-50 border border-pink-200 rounded-[16px] p-4 text-center"><div class="text-[11px] font-bold text-pink-700">bKash Send Money</div><div class="text-[26px] font-black">01344758887</div></div><input id="da" type="number" placeholder="Amount Min 50" class="w-full mt-4 border rounded-[12px] px-4 py-3"><input id="ds" placeholder="Your bKash Number" class="w-full mt-3 border rounded-[12px] px-4 py-3"><input id="dt" placeholder="TrxID" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="dep()" class="w-full mt-4 bg-zinc-900 text-white py-3.5 rounded-full font-bold">Submit</button></div></div>`}
else if(r=='/wallet/withdraw'){html=`<div class="max-w-[500px] mx-auto px-4 py-6"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="text-[20px] font-black mt-2">Withdraw</h1><div class="bg-white border rounded-[24px] p-6 mt-4"><input id="wa" type="number" placeholder="Amount Min 100" class="w-full border rounded-[12px] px-4 py-3"><input id="wn" placeholder="bKash Number" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="wd()" class="w-full mt-4 bg-zinc-900 text-white py-3.5 rounded-full font-bold">Request</button></div></div>`}
else if(r=='/transactions'){html=`<div class="max-w-[600px] mx-auto px-4 py-6"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="text-[20px] font-black mt-2">Transactions</h1><div class="mt-4 space-y-2">${DB.trx.map(t=>`<div class="bg-white border rounded-[14px] p-4 flex justify-between"><div><b class="text-[13px]">${t.type}</b><div class="text-[11px] text-zinc-500">${t.id}</div></div><b>৳${t.amt}</b></div>`).join('')||'No trx'}</div></div>`}
else if(r=='/profile'){html=`<div class="max-w-[600px] mx-auto px-4 py-6"><h1 class="text-[20px] font-black">Profile</h1><div class="bg-white border rounded-[24px] p-6 mt-4"><b>${DB.user.name}</b><div class="text-[12px] text-zinc-500">${DB.user.email}</div></div><button onclick="logout()" class="w-full mt-4 p-4 bg-white border rounded-[24px] text-left text-red-600 font-bold">Logout</button></div>`}
const bottom=`<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2"><button onclick="nav('/')" class="flex flex-col items-center text-[10px]">🏠<br>Home</button><button onclick="nav('/tournaments')" class="flex flex-col items-center text-[10px]">🏆<br>Tour</button><button onclick="nav('/orders')" class="flex flex-col items-center text-[10px]">📦<br>Orders</button><button onclick="nav('/wallet')" class="flex flex-col items-center text-[10px]">💳<br>Wallet</button><button onclick="nav('/profile')" class="flex flex-col items-center text-[10px]">👤<br>Profile</button></nav><div class="h-[70px] md:hidden"></div>`;
document.getElementById('app').innerHTML=h+html+bottom;
}
window.doLogin=()=>{const e=document.getElementById('le').value;if(!e){alert('Email দাও');return}DB.user={id:'TX-'+Math.floor(10000+Math.random()*90000),name:e.split('@')[0],email:e};save();nav('/')}
window.doReg=()=>{const n=document.getElementById('rn').value;const e=document.getElementById('re').value;if(!n||!e){alert('Fill');return}DB.user={id:'TX-'+Math.floor(10000+Math.random()*90000),name:n,email:e};save();nav('/')}
window.joinT=(id)=>{const t=TOURNAMENTS.find(x=>x.id==id);if(DB.balance<t.entry){if(confirm(`Balance ৳${DB.balance} লাগবে ৳${t.entry}. Deposit?`))nav('/wallet/deposit');return}DB.balance-=t.entry;const oid='TX'+Math.floor(100000+Math.random()*900000);DB.orders.push({id:oid,tid:t.id,name:t.title,amount:t.entry});DB.trx.unshift({id:oid,type:'Entry '+t.title,amt:t.entry});save();alert('Joined #'+oid);nav('/orders')}
window.dep=()=>{const a=document.getElementById('da').value;const tr=document.getElementById('dt').value;if(!a||!tr){alert('Fill');return}DB.balance+=Number(a);DB.trx.unshift({id:tr,type:'Deposit bKash 01344758887',amt:a});save();alert('Deposit OK ৳'+a);nav('/wallet')}
window.wd=()=>{const a=Number(document.getElementById('wa').value);if(a<100||a>DB.balance){alert('Invalid');return}DB.balance-=a;DB.trx.unshift({id:'WD'+Date.now(),type:'Withdraw',amt:a});save();alert('Withdraw ৳'+a);nav('/wallet')}
window.logout=()=>{localStorage.clear();location.hash='/login';location.reload()}
render();addEventListener('hashchange',()=>{state.route=location.hash.slice(1)||'/';render()})
</script></body></html>
