<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TournaX - Compete. Play. Win.</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f9f9f9]"><div id="app"></div>
<script>
const CATS=["All","Free Fire","PUBG Mobile","BGMI","eFootball"];
const T=[
{id:"ff1",t:"TournaX Weekly Clash",g:"Free Fire",e:20,p:2000,j:68,tot:100,d:"22 Sep",s:"upcoming",b:"🔥"},
{id:"ff2",t:"TournaX Pro Battle",g:"Free Fire",e:50,p:5000,j:42,tot:48,d:"23 Sep",s:"upcoming",b:"💎"},
{id:"pb1",t:"TournaX Battle Royale",g:"PUBG Mobile",e:50,p:5000,j:92,tot:100,d:"21 Sep",s:"live",b:"🎯"},
];
let DB={user:JSON.parse(localStorage.getItem('u')||'null'),bal:Number(localStorage.getItem('b')||'850'),ord:JSON.parse(localStorage.getItem('o')||'[]'),trx:JSON.parse(localStorage.getItem('tr')||'[]'),rooms:JSON.parse(localStorage.getItem('rm')||'{}')};
function sv(){localStorage.setItem('u',JSON.stringify(DB.user));localStorage.setItem('b',DB.bal);localStorage.setItem('o',JSON.stringify(DB.ord));localStorage.setItem('tr',JSON.stringify(DB.trx));localStorage.setItem('rm',JSON.stringify(DB.rooms));}
let S={r:location.hash.slice(1)||'/',cat:"All",sel:null,ad:false};
function nav(r){location.hash=r;S.r=r;render();scrollTo(0,0)}
function card(x){return `<div onclick="op('${x.id}')" class="bg-white border rounded-[18px] p-4"><div class="flex gap-3"><div class="w-12 h-12 bg-zinc-100 rounded-[12px] flex items-center justify-center text-xl">${x.b}</div><div class="flex-1"><div class="flex justify-between"><b class="text-[14px]">${x.t}</b><span class="text-[10px] px-2 py-1 rounded-full ${x.s=='live'?'bg-red-500 text-white':'bg-zinc-900 text-white'}">${x.s}</span></div><p class="text-[12px] text-zinc-500">${x.g} • ${x.d}</p><div class="flex gap-2 mt-2"><span class="bg-zinc-50 border rounded-full px-3 py-1 text-[11px]">৳${x.e} Entry</span><span class="bg-amber-50 border text-amber-700 rounded-full px-3 py-1 text-[11px] font-bold">৳${x.p}</span></div></div></div></div>`}
window.op=(id)=>{S.sel=T.find(a=>a.id==id);nav('/t/'+id)}
function render(){
let r=S.r;
if(r=='/admin'){if(!S.ad){document.getElementById('app').innerHTML=`<div class="min-h-screen bg-black flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-8 w-full max-w-[350px] text-center"><h1 class="text-white font-black text-[20px]">AF ADMIN</h1><input id="cd" type="password" placeholder="Code" class="w-full mt-4 bg-black border border-zinc-700 rounded-full px-4 py-3 text-white text-center"><button onclick="if(document.getElementById('cd').value=='AF-0134-ADMIN'){S.ad=true;render()}else alert('Wrong')" class="w-full mt-3 bg-[#39FF14] text-black font-bold py-3 rounded-full">UNLOCK</button><p class="text-[10px] text-zinc-600 mt-3">AF-0134-ADMIN | 01344758887</p></div></div>`;return}else{document.getElementById('app').innerHTML=`<div class="min-h-screen bg-black text-white p-4"><div class="flex justify-between"><b class="text-[#39FF14]">ADMIN AF</b><button onclick="S.ad=false;nav('/')" class="border px-3 py-1 rounded-full text-[12px]">Logout</button></div><div class="mt-6 bg-zinc-900 border border-zinc-800 rounded-[20px] p-5"><h2>Room ID দাও</h2><input id="tid" placeholder="Tournament ID ex: ff1" class="w-full mt-3 bg-black border border-zinc-700 rounded-[12px] px-4 py-3"><input id="rid" placeholder="Room ID" class="w-full mt-2 bg-black border border-zinc-700 rounded-[12px] px-4 py-3"><input id="rp" placeholder="Password" class="w-full mt-2 bg-black border border-zinc-700 rounded-[12px] px-4 py-3"><button onclick="DB.rooms[document.getElementById('tid').value]={id:document.getElementById('rid').value,pass:document.getElementById('rp').value};sv();alert('LIVE')" class="w-full mt-3 bg-[#39FF14] text-black font-bold py-3 rounded-full">LIVE করো</button></div><div class="mt-4 bg-zinc-900 border border-zinc-800 rounded-[20px] p-5"><h2>bKash 01344758887 Deposit</h2><div class="mt-3 space-y-2">${DB.trx.filter(t=>t.t.includes('Deposit')).map(d=>`<div class="bg-black p-3 rounded-[12px] text-[12px]">${d.t} ৳${d.a} - ${d.id}</div>`).join('')||'No req'}</div></div></div>`;return;}}
if(!DB.user&&r!='/login'&&r!='/register'&&r!='/admin'){nav('/login');return;}
let h=`<header class="bg-white border-b sticky top-0 z-10"><div class="max-w-[1100px] mx-auto px-4 h-[60px] flex justify-between items-center"><b>TournaX</b><span class="text-[12px] font-bold">৳${DB.bal}</span></div></header>`;
let html='';
if(r=='/login'){html=`<div class="max-w-[380px] mx-auto p-6 mt-10 bg-white border rounded-[24px]"><h1 class="font-black text-[22px]">Login</h1><input id="le" placeholder="Email" class="w-full mt-4 border rounded-[12px] px-4 py-3"><input id="lp" type="password" placeholder="Pass" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="DB.user={name:document.getElementById('le').value.split('@')[0],email:document.getElementById('le').value};sv();nav('/')" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">Login</button><button onclick="nav('/register')" class="w-full mt-3 border py-3 rounded-full text-[13px]">Create Account</button></div>`}
else if(r=='/register'){html=`<div class="max-w-[380px] mx-auto p-6 mt-10 bg-white border rounded-[24px]"><h1 class="font-black text-[22px]">Create Account</h1><input id="rn" placeholder="Name" class="w-full mt-4 border rounded-[12px] px-4 py-3"><input id="re" placeholder="Email" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="DB.user={name:document.getElementById('rn').value,email:document.getElementById('re').value};sv();nav('/')" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">Sign Up</button></div>`}
else if(r=='/'||r==''){html=`<div class="max-w-[1100px] mx-auto p-4"><div class="bg-zinc-900 text-white rounded-[24px] p-6"><h1 class="text-[30px] font-black leading-none">Compete.<br>Play. Win.</h1><p class="text-zinc-400 text-[12px] mt-2">bKash: 01344758887</p></div><div class="flex gap-2 mt-4 overflow-auto">${CATS.map(c=>`<button onclick="S.cat='${c}';render()" class="px-4 py-2 rounded-full border text-[13px] ${S.cat==c?'bg-zinc-900 text-white':'bg-white'}">${c}</button>`).join('')}</div><div class="grid md:grid-cols-3 gap-3 mt-4">${T.filter(x=>S.cat=='All'||x.g==S.cat).map(card).join('')}</div></div>`}
else if(r.startsWith('/t/')){let x=S.sel||T[0];let rm=DB.rooms[x.id];html=`<div class="max-w-[600px] mx-auto p-4"><button onclick="nav('/')" class="text-[13px]">← Back</button><div class="bg-white border rounded-[24px] overflow-hidden mt-4"><div class="h-[100px] bg-zinc-900 flex items-center justify-center text-4xl">${x.b}</div><div class="p-5"><h1 class="font-black text-[18px]">${x.t}</h1><p class="text-[12px] text-zinc-500">${x.g}</p>${rm?`<div class="mt-3 bg-black text-white rounded-[12px] p-3 font-mono">ID:${rm.id} PASS:${rm.pass} 🔴 LIVE</div>`:''}<button onclick="if(DB.bal<x.e){alert('Balance কম');nav('/wallet/deposit');return}DB.bal-=x.e;let oid='TX'+Math.floor(100000+Math.random()*900000);DB.ord.push({id:oid,tid:x.id,name:x.t});DB.trx.unshift({id:oid,t:'Entry '+x.t,a:x.e});sv();alert('Joined '+oid);nav('/orders')" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">JOIN ৳${x.e}</button></div></div></div>`}
else if(r=='/orders'){html=`<div class="max-w-[600px] mx-auto p-4"><h1 class="font-black">My Orders</h1><div class="mt-4 space-y-3">${DB.ord.map(o=>{let rm=DB.rooms[o.tid];return `<div class="bg-white border rounded-[18px] p-4"><b class="text-[13px]">${o.name}</b><div class="text-[11px] text-zinc-500">#${o.id}</div>${rm?`<div class="mt-2 bg-black text-white rounded-[10px] px-3 py-2 font-mono text-[12px]">ROOM: ${rm.id} | ${rm.pass}</div>`:''}</div>`}).join('')||'<div class="bg-white border rounded-[24px] p-10 text-center">No orders</div>'}</div></div>`}
else if(r=='/wallet'){html=`<div class="max-w-[600px] mx-auto p-4"><h1 class="font-black">Wallet ৳${DB.bal}</h1><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="nav('/wallet/deposit')" class="bg-zinc-900 text-white py-3 rounded-full font-bold">Deposit</button><button onclick="nav('/wallet/withdraw')" class="border py-3 rounded-full font-bold">Withdraw</button></div><div class="mt-4 bg-pink-50 border border-pink-200 rounded-[14px] p-4"><b>bKash Personal</b><div class="text-[22px] font-black">01344758887</div></div><button onclick="nav('/transactions')" class="w-full mt-3 border py-3 rounded-full text-[13px]">Transactions</button></div>`}
else if(r=='/wallet/deposit'){html=`<div class="max-w-[500px] mx-auto p-4"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="font-black mt-2">Deposit</h1><div class="bg-white border rounded-[24px] p-5 mt-4"><div class="bg-pink-50 border border-pink-200 rounded-[16px] p-4 text-center"><div class="text-[11px] font-bold text-pink-700">bKash Send Money</div><div class="text-[26px] font-black">01344758887</div></div><input id="da" type="number" placeholder="Amount" class="w-full mt-4 border rounded-[12px] px-4 py-3"><input id="dt" placeholder="TrxID" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="DB.bal+=Number(document.getElementById('da').value);DB.trx.unshift({id:document.getElementById('dt').value,t:'Deposit bKash 01344758887',a:document.getElementById('da').value});sv();alert('OK');nav('/wallet')" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">Submit</button></div></div>`}
else if(r=='/wallet/withdraw'){html=`<div class="max-w-[500px] mx-auto p-4"><button onclick="nav('/wallet')" class="text-[13px]">← Wallet</button><h1 class="font-black mt-2">Withdraw</h1><div class="bg-white border rounded-[24px] p-5 mt-4"><input id="wa" type="number" placeholder="Amount Min 100" class="w-full border rounded-[12px] px-4 py-3"><input id="wn" placeholder="bKash Number" class="w-full mt-3 border rounded-[12px] px-4 py-3"><button onclick="let a=Number(document.getElementById('wa').value);DB.bal-=a;DB.trx.unshift({id:'WD'+Date.now(),t:'Withdraw',a:a});sv();alert('Req ৳'+a);nav('/wallet')" class="w-full mt-4 bg-zinc-900 text-white py-3 rounded-full font-bold">Request</button></div></div>`}
else if(r=='/transactions'){html=`<div class="max-w-[600px] mx-auto p-4"><h1 class="font-black">Transactions</h1><div class="mt-4 space-y-2">${DB.trx.map(t=>`<div class="bg-white border rounded-[14px] p-4 flex justify-between"><div><b class="text-[13px]">${t.t}</b><div class="text-[11px] text-zinc-500">${t.id}</div></div><b>৳${t.a}</b></div>`).join('')||'No trx'}</div></div>`}
else if(r=='/profile'){html=`<div class="max-w-[600px] mx-auto p-4"><h1 class="font-black">Profile</h1><div class="bg-white border rounded-[24px] p-6 mt-4"><b>${DB.user.name}</b><div class="text-[12px] text-zinc-500">${DB.user.email}</div></div><button onclick="localStorage.clear();location.hash='/login';location.reload()" class="w-full mt-4 p-4 bg-white border rounded-[24px] text-left text-red-600 font-bold">Logout</button></div>`}
let bot=`<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2"><button onclick="nav('/')" class="flex flex-col items-center text-[10px]">🏠<br>Home</button><button onclick="nav('/tournaments')" class="flex flex-col items-center text-[10px]">🏆<br>Tour</button><button onclick="nav('/orders')" class="flex flex-col items-center text-[10px]">📦<br>Orders</button><button onclick="nav('/wallet')" class="flex flex-col items-center text-[10px]">💳<br>Wallet</button><button onclick="nav('/profile')" class="flex flex-col items-center text-[10px]">👤<br>Profile</button></nav><div class="h-[70px] md:hidden"></div>`;
document.getElementById('app').innerHTML=h+html+bot;
}
render();addEventListener('hashchange',()=>{S.r=location.hash.slice(1)||'/';render()})
</script></body></html>
